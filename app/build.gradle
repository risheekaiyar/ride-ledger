plugins { id 'com.android.application' }
android {
    namespace 'app.rideledger'
    compileSdk 35
    defaultConfig { applicationId 'app.rideledger'; minSdk 26; targetSdk 35; versionCode 12; versionName '0.5.0' }
    defaultConfig.manifestPlaceholders = [odoLabel: 'Odo']
    buildTypes {
        fieldJournal {
            initWith debug
            applicationIdSuffix '.experience'
            versionNameSuffix '-preview'
            manifestPlaceholders = [odoLabel: 'ODOme Preview']
            matchingFallbacks = ['debug']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('syncDashboard', Sync) { from rootProject.file('web'); into layout.buildDirectory.dir('generated/odoAssets/odo') }
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/odoAssets')
tasks.named('preBuild').configure { dependsOn 'syncDashboard' }
